---
- name: Create wordpress directory
  ansible.builtin.file:
    path: "{{ wordpress_dir }}"
    state: directory
    mode: "0750"

- name: Copy image build files
  ansible.builtin.copy:
    src: build/
    dest: "{{ wordpress_dir }}/build/"
    mode: "0644"

# db_password is also written by the mariadb role (same content -> no change).
# Writing it here too keeps this role deployable on its own.
- name: Write wordpress secrets
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ secrets_dir }}/{{ item.name }}"
    mode: "0600"
  loop:
    - { name: db_password, value: "{{ db_password }}" }
    - { name: wp_admin_password, value: "{{ wp_admin_password }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write wordpress compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ wordpress_dir }}/compose.yml"
    mode: "0644"

- name: Start wordpress container
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    project_name: "{{ compose_project }}"
    files: ["{{ wordpress_dir }}/compose.yml"]
    build: policy
    # Our images are built locally, never downloaded (no useless Docker Hub lookups)
    pull: never
    state: present
    wait: true
    wait_timeout: 300
  environment:
    COMPOSE_IGNORE_ORPHANS: "true"
