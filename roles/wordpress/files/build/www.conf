[www]
user = www-data
group = www-data
; All interfaces INSIDE the container: nginx reaches us over the "frontend"
; Docker network. No port is published on the host.
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; PHP warnings/errors from workers go to the container logs too
catch_workers_output = yes
decorate_workers_output = no
