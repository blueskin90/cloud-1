---
- name: Ensure admin SSH key is authorized (before disabling passwords below)
  ansible.builtin.import_tasks: ssh_key.yml

- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present

# --- Firewall (ufw) -----------------------------------------------------------
# SSH rule FIRST, so enabling ufw never locks us out.
# "limit" = allow, but block an IP opening >6 connections in 30s (brute-force).
- name: Allow SSH (rate limited)
  community.general.ufw:
    rule: limit
    port: "{{ security_ssh_port | string }}"
    proto: tcp

- name: Allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ security_allowed_ports }}"

- name: Deny all other incoming traffic and enable ufw
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

# NOTE: Docker writes its own iptables rules and BYPASSES ufw for published
# ports. That's why only the nginx container publishes ports (80/443) and the
# database publishes none.

# --- SSH hardening ------------------------------------------------------------
# File named 00-* because sshd keeps the FIRST value it reads, and cloud-init
# ships 50-cloud-init.conf which may re-enable password auth.
# Ubuntu 24.04 starts sshd via socket activation, so /run/sshd may not exist
# yet and "sshd -t" (validation below) would fail without it.
- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: Harden SSH daemon
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# --- fail2ban -----------------------------------------------------------------
# Ubuntu enables the sshd jail by default; we just make sure it runs.
- name: Ensure fail2ban is running and enabled at boot
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
