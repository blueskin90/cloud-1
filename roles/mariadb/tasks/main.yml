---
- name: Create mariadb directory
  ansible.builtin.file:
    path: "{{ mariadb_dir }}"
    state: directory
    mode: "0750"

- name: Copy image build files
  ansible.builtin.copy:
    src: build/
    dest: "{{ mariadb_dir }}/build/"
    mode: "0644"

# no_log: the secret must never appear in Ansible output (even with -vvv)
- name: Write database secrets
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ secrets_dir }}/{{ item.name }}"
    mode: "0600"
  loop:
    - { name: db_root_password, value: "{{ db_root_password }}" }
    - { name: db_password, value: "{{ db_password }}" }
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Write mariadb compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ mariadb_dir }}/compose.yml"
    mode: "0644"

# build: policy -> only build if the image tag does not exist yet (see vars).
# wait: true -> the task ends only when the healthcheck reports "healthy".
- name: Start mariadb container
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    project_name: "{{ compose_project }}"
    files: ["{{ mariadb_dir }}/compose.yml"]
    build: policy
    # Our images are built locally, never downloaded (no useless Docker Hub lookups)
    pull: never
    state: present
    wait: true
    wait_timeout: 120
  environment:
    # other services of the same project are not in this file: don't warn
    COMPOSE_IGNORE_ORPHANS: "true"
