---
- name: Check the target OS is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in common_supported_versions
    fail_msg: >-
      Unsupported OS {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
      Supported: Ubuntu {{ common_supported_versions | join(', ') }}.
    quiet: true

- name: Update apt cache (skipped if refreshed less than 1h ago -> idempotent)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"
