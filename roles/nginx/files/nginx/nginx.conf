user nginx;
worker_processes auto;
pcre_jit on;
# Logs go to the container output -> "docker compose logs nginx"
error_log /dev/stderr warn;
include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;          # don't advertise the nginx version
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # TLS: modern protocols only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Docker's embedded DNS. Upstream names (wordpress, phpmyadmin) are
    # resolved per request, so nginx starts even if they are down and follows
    # them when they are recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/http.d/*.conf;
}
