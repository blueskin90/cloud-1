---
# Image tag = hash of the build files (see roles/mariadb/vars/main.yml)
phpmyadmin_build_dir: "{{ role_path }}/files/build"
phpmyadmin_build_files: [Dockerfile, entrypoint.sh, php-fpm.conf, www.conf, phpmyadmin.ini]
phpmyadmin_build_paths: "{{ phpmyadmin_build_files | map('regex_replace', '^', phpmyadmin_build_dir ~ '/') }}"
phpmyadmin_image_tag: "{{ (query('ansible.builtin.file', *phpmyadmin_build_paths) | join) | hash('sha1') | truncate(12, true, '', 0) }}"
phpmyadmin_image: "cloud1/phpmyadmin:{{ phpmyadmin_image_tag }}"
